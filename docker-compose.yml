name: expense-tracking

services:
  identity-db:
    image: mysql:8.0
    container_name: expense-identity-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expense_identity}
      MYSQL_USER: ${MYSQL_USER:-expense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-expense}
    ports:
      - "3307:3306"
    volumes:
      - identity-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense-net

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: expense-identity
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IdentityDb: "server=identity-db;port=3306;database=${MYSQL_DATABASE:-expense_identity};user=${MYSQL_USER:-expense};password=${MYSQL_PASSWORD:-expense};"
      OAuth__Issuer: ${IDENTITY_ISSUER:-http://localhost:5080}
      Seed__Enabled: ${IDENTITY_SEED_ENABLED:-true}
    ports:
      - "${IDENTITY_HTTP_PORT:-5080}:8080"
    networks:
      - expense-net

  accounts-db:
    image: mysql:8.0
    container_name: expense-accounts-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${ACCOUNTS_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${ACCOUNTS_DB_NAME:-expense_accounts}
      MYSQL_USER: ${ACCOUNTS_DB_USER:-expense}
      MYSQL_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-expense}
    ports:
      - "3308:3306"
    volumes:
      - accounts-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${ACCOUNTS_DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense-net

  accounts:
    build:
      context: .
      dockerfile: services/accounts/Dockerfile
    container_name: expense-accounts
    depends_on:
      accounts-db:
        condition: service_healthy
      identity:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AccountsDb: "server=accounts-db;port=3306;database=${ACCOUNTS_DB_NAME:-expense_accounts};user=${ACCOUNTS_DB_USER:-expense};password=${ACCOUNTS_DB_PASSWORD:-expense};"
      # Issuer publico (para validar o 'iss' do token) + metadados pela rede interna.
      Jwt__Authority: ${IDENTITY_ISSUER:-http://localhost:5080}
      Jwt__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
      Jwt__Audience: expense-tracking-api
      Cors__AllowedOrigins__0: "http://localhost:${WEB_HTTP_PORT:-5173}"
    ports:
      - "${ACCOUNTS_HTTP_PORT:-5090}:8080"
    networks:
      - expense-net

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: expense-gateway
    depends_on:
      identity:
        condition: service_started
      accounts:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Authority: ${IDENTITY_ISSUER:-http://localhost:5080}
      Jwt__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
      Jwt__Audience: expense-tracking-api
      Cors__AllowedOrigins__0: "http://localhost:${WEB_HTTP_PORT:-5173}"
      # Destino do cluster 'accounts' na rede interna.
      ReverseProxy__Clusters__accounts__Destinations__accounts-1__Address: "http://accounts:8080/"
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    networks:
      - expense-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_IDENTITY_AUTHORITY: ${IDENTITY_ISSUER:-http://localhost:5080}
        VITE_CLIENT_ID: expense-tracking-spa
        VITE_REDIRECT_URI: "http://localhost:${WEB_HTTP_PORT:-5173}/callback"
        VITE_SCOPE: "openid profile expenses.read expenses.write offline_access"
    container_name: expense-web
    depends_on:
      - identity
    ports:
      - "${WEB_HTTP_PORT:-5173}:80"
    networks:
      - expense-net

volumes:
  identity-db-data:
  accounts-db-data:

networks:
  expense-net:
    driver: bridge

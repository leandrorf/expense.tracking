name: expense-tracking

services:
  identity-db:
    image: mysql:8.0
    container_name: expense-identity-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expense_identity}
      MYSQL_USER: ${MYSQL_USER:-expense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-expense}
    ports:
      - "3307:3306"
    volumes:
      - identity-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense-net

  identity:
    # IDX-5 (ADR-0003): o identity vive em github.com/leandrorf/expense-identity e entra aqui pela
    # imagem publicada, com versao fixada (troca de versao por PR, que roda o E2E). Para testar uma
    # mudanca local do identity junto: docker-compose.identity-local.yml.
    image: ghcr.io/leandrorf/expense-identity:1.0.0
    container_name: expense-identity
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # OBS-2/OBS-3: traces e metricas via OTLP/gRPC para o OpenTelemetry Collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      ConnectionStrings__IdentityDb: "server=identity-db;port=3306;database=${MYSQL_DATABASE:-expense_identity};user=${MYSQL_USER:-expense};password=${MYSQL_PASSWORD:-expense};"
      OAuth__Issuer: ${IDENTITY_ISSUER:-http://localhost:5080}
      Seed__Enabled: ${IDENTITY_SEED_ENABLED:-true}
      # IDX-2 (ADR-0003): os clientes OAuth, o usuario demo e o CORS que este monorepo usa ficam em
      # infra/identity/appsettings.Production.json; aqui so os segredos (valores de desenvolvimento).
      Seed__Clients__expense-tracking-service__Secret: ${IDENTITY_SERVICE_CLIENT_SECRET:-dev-service-secret}
      Seed__Users__demo__Password: ${IDENTITY_DEMO_PASSWORD:-Password123!}
      LoginPage__Hint: "Demo: demo@expense.local / ${IDENTITY_DEMO_PASSWORD:-Password123!}"
    volumes:
      - ./infra/identity/appsettings.Production.json:/app/appsettings.Production.json:ro
    ports:
      - "${IDENTITY_HTTP_PORT:-5080}:8080"
    networks:
      - expense-net

  accounts-db:
    image: mysql:8.0
    container_name: expense-accounts-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${ACCOUNTS_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${ACCOUNTS_DB_NAME:-expense_accounts}
      MYSQL_USER: ${ACCOUNTS_DB_USER:-expense}
      MYSQL_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-expense}
    ports:
      - "3308:3306"
    volumes:
      - accounts-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${ACCOUNTS_DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense-net

  accounts:
    build:
      context: .
      dockerfile: services/accounts/Dockerfile
    container_name: expense-accounts
    depends_on:
      accounts-db:
        condition: service_healthy
      identity:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # OBS-2/OBS-3: traces e metricas via OTLP/gRPC para o OpenTelemetry Collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      ConnectionStrings__AccountsDb: "server=accounts-db;port=3306;database=${ACCOUNTS_DB_NAME:-expense_accounts};user=${ACCOUNTS_DB_USER:-expense};password=${ACCOUNTS_DB_PASSWORD:-expense};"
      # Issuer publico (para validar o 'iss' do token) + metadados pela rede interna.
      Jwt__Authority: ${IDENTITY_ISSUER:-http://localhost:5080}
      Jwt__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
      Jwt__Audience: expense-tracking-api
      Cors__AllowedOrigins__0: "http://localhost:${WEB_HTTP_PORT:-5173}"
    ports:
      - "${ACCOUNTS_HTTP_PORT:-5090}:8080"
    networks:
      - expense-net

  transactions-db:
    image: mysql:8.0
    container_name: expense-transactions-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${TRANSACTIONS_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${TRANSACTIONS_DB_NAME:-expense_transactions}
      MYSQL_USER: ${TRANSACTIONS_DB_USER:-expense}
      MYSQL_PASSWORD: ${TRANSACTIONS_DB_PASSWORD:-expense}
    ports:
      - "3309:3306"
    volumes:
      - transactions-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${TRANSACTIONS_DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense-net

  transactions:
    build:
      context: .
      dockerfile: services/transactions/Dockerfile
    container_name: expense-transactions
    depends_on:
      transactions-db:
        condition: service_healthy
      identity:
        condition: service_started
      accounts:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # OBS-2/OBS-3: traces e metricas via OTLP/gRPC para o OpenTelemetry Collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      ConnectionStrings__TransactionsDb: "server=transactions-db;port=3306;database=${TRANSACTIONS_DB_NAME:-expense_transactions};user=${TRANSACTIONS_DB_USER:-expense};password=${TRANSACTIONS_DB_PASSWORD:-expense};"
      Jwt__Authority: ${IDENTITY_ISSUER:-http://localhost:5080}
      Jwt__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
      Jwt__Audience: expense-tracking-api
      Services__AccountsBaseUrl: "http://accounts:8080"
      Cors__AllowedOrigins__0: "http://localhost:${WEB_HTTP_PORT:-5173}"
      # EVT-4: token de servico para buscar no accounts o escopo dos lancamentos legados.
      ServiceAuth__TokenEndpoint: "http://identity:8080/oauth/token"
      ServiceAuth__ClientId: expense-tracking-service
      ServiceAuth__ClientSecret: ${TRANSACTIONS_SERVICE_CLIENT_SECRET:-dev-service-secret}
    ports:
      - "${TRANSACTIONS_HTTP_PORT:-5100}:8080"
    networks:
      - expense-net

  # EVT-2: banco proprio do reporting (projecao alimentada pelo feed de eventos do transactions).
  reporting-db:
    image: mysql:8.0
    container_name: expense-reporting-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${REPORTING_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${REPORTING_DB_NAME:-expense_reporting}
      MYSQL_USER: ${REPORTING_DB_USER:-expense}
      MYSQL_PASSWORD: ${REPORTING_DB_PASSWORD:-expense}
    ports:
      - "3310:3306"
    volumes:
      - reporting-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${REPORTING_DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense-net

  reporting:
    build:
      context: .
      dockerfile: services/reporting/Dockerfile
    container_name: expense-reporting
    depends_on:
      reporting-db:
        condition: service_healthy
      identity:
        condition: service_started
      # EVT-3: o resumo le a projecao; o transactions so e lido pelo worker (feed /events).
      transactions:
        condition: service_started
      # INV-4: a fatura le o ciclo do cartao no accounts, com o token do usuario.
      accounts:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # OBS-2/OBS-3: traces e metricas via OTLP/gRPC para o OpenTelemetry Collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      Jwt__Authority: ${IDENTITY_ISSUER:-http://localhost:5080}
      Jwt__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
      Jwt__Audience: expense-tracking-api
      Services__TransactionsBaseUrl: "http://transactions:8080"
      Services__AccountsBaseUrl: "http://accounts:8080"
      Cors__AllowedOrigins__0: "http://localhost:${WEB_HTTP_PORT:-5173}"
      # EVT-2: projecao em banco proprio, lendo o feed /events do transactions com token de servico.
      ConnectionStrings__ReportingDb: "server=reporting-db;port=3306;database=${REPORTING_DB_NAME:-expense_reporting};user=${REPORTING_DB_USER:-expense};password=${REPORTING_DB_PASSWORD:-expense};"
      ServiceAuth__TokenEndpoint: "http://identity:8080/oauth/token"
      ServiceAuth__ClientId: expense-tracking-service
      ServiceAuth__ClientSecret: ${REPORTING_SERVICE_CLIENT_SECRET:-dev-service-secret}
    ports:
      - "${REPORTING_HTTP_PORT:-5110}:8080"
    networks:
      - expense-net

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: expense-gateway
    depends_on:
      identity:
        condition: service_started
      accounts:
        condition: service_started
      transactions:
        condition: service_started
      reporting:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # OBS-2/OBS-3: traces e metricas via OTLP/gRPC para o OpenTelemetry Collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      Jwt__Authority: ${IDENTITY_ISSUER:-http://localhost:5080}
      Jwt__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
      Jwt__Audience: expense-tracking-api
      Cors__AllowedOrigins__0: "http://localhost:${WEB_HTTP_PORT:-5173}"
      # Destinos dos clusters na rede interna.
      ReverseProxy__Clusters__accounts__Destinations__accounts-1__Address: "http://accounts:8080/"
      ReverseProxy__Clusters__transactions__Destinations__transactions-1__Address: "http://transactions:8080/"
      ReverseProxy__Clusters__reporting__Destinations__reporting-1__Address: "http://reporting:8080/"
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    networks:
      - expense-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_IDENTITY_AUTHORITY: ${IDENTITY_ISSUER:-http://localhost:5080}
        VITE_CLIENT_ID: expense-tracking-spa
        VITE_REDIRECT_URI: "http://localhost:${WEB_HTTP_PORT:-5173}/callback"
        VITE_SCOPE: "openid profile expenses.read expenses.write offline_access"
        VITE_API_BASE_URL: "http://localhost:${GATEWAY_HTTP_PORT:-8080}"
    container_name: expense-web
    depends_on:
      - identity
    ports:
      - "${WEB_HTTP_PORT:-5173}:80"
    networks:
      - expense-net

  # OBS-3: ponto unico de entrada da telemetria. Recebe OTLP dos servicos, repassa os traces
  # ao Jaeger e expoe as metricas para o Prometheus (config em infra/observability/).
  # As portas OTLP ficam no host para servicos rodando fora do Docker (dotnet run).
  # Os servicos nao dependem dele para subir: se estiver fora, a telemetria e descartada.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: expense-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    networks:
      - expense-net

  # OBS-2: backend de tracing distribuido (UI). Recebe os spans do collector.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: expense-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    networks:
      - expense-net

  # OBS-3: metricas dos servicos (UI e PromQL), coletadas do collector.
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: expense-prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - expense-net

volumes:
  identity-db-data:
  accounts-db-data:
  transactions-db-data:
  reporting-db-data:

networks:
  expense-net:
    driver: bridge

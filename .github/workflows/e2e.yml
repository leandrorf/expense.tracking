name: E2E

# CI-2: em PRs para main (e sob demanda), sobe o stack completo via docker compose,
# aguarda os servicos ficarem saudaveis e roda os specs Cypress headless.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Cypress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O docker-compose usa defaults (${VAR:-...}) para todas as variaveis, e o
      # seed do identity cria o usuario demo (demo@expense.local) que os specs usam.
      - name: Subir o stack (build + up)
        run: docker compose up -d --build

      - name: Aguardar os servicos ficarem prontos
        run: |
          set -euo pipefail
          wait_for() {
            local name="$1" url="$2" tries=60
            echo "Aguardando $name ($url)..."
            for i in $(seq 1 "$tries"); do
              if curl -fsS -o /dev/null "$url"; then
                echo "$name OK (tentativa $i)"
                return 0
              fi
              sleep 5
            done
            echo "::error::$name nao respondeu a tempo ($url)"
            return 1
          }
          wait_for "identity (discovery)" "http://localhost:5080/.well-known/openid-configuration"
          wait_for "gateway (health)"     "http://localhost:8080/health"
          wait_for "web (SPA)"            "http://localhost:5173"

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_IDENTITY_URL: http://localhost:5080
          E2E_DEMO_EMAIL: demo@expense.local
          E2E_DEMO_PASSWORD: Password123!

      - name: Publicar screenshots do Cypress (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/web/cypress/screenshots
          if-no-files-found: ignore

      - name: Logs do docker compose (em falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar o stack
        if: always()
        run: docker compose down -v

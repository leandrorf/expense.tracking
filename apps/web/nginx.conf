server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos do build com hash no nome: podem ficar em cache para sempre. Um arquivo que nao existe mais
    # (de um build anterior) responde 404, em vez do index.html, que o navegador recusaria como modulo JS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fallback de SPA: rotas do cliente (ex.: /callback) servem o index.html. Ele nunca vem do cache sem
    # revalidar: depois de um deploy, o navegador busca o index.html novo, que aponta para os arquivos novos.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
